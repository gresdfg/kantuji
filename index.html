<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="看图记">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>看图记</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font:16px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f2f2f7;color:#1c1c1e;
    padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior-y:contain;
  }
  header{
    position:sticky;top:0;z-index:10;
    background:rgba(242,242,247,.92);backdrop-filter:blur(12px);
    padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;
  }
  .hrow{display:flex;align-items:baseline;margin-bottom:10px}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em;flex:1}
  h1 span{font-size:13px;font-weight:400;color:#8e8e93;margin-left:6px}
  #menu{border:0;background:none;color:#0a84ff;font-size:15px;font-family:inherit;padding:0 2px}
  #q{
    width:100%;height:40px;border:0;border-radius:11px;background:#e3e3e9;
    padding:0 12px;font-size:16px;outline:none;
  }
  main{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    padding:4px 14px 110px;
  }
  .card{
    background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07);
    display:flex;flex-direction:column;
  }
  .card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#e3e3e9}
  .card .txt{padding:8px 10px 10px}
  .card .price{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .card .price i{font-size:14px;font-weight:600;font-style:normal;margin-right:1px}
  .card .name{font-size:13px;color:#6c6c70;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .empty{grid-column:1/-1;text-align:center;color:#a1a1a6;padding:60px 24px;font-size:15px;line-height:1.7}
  #add{
    position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 22px);
    width:60px;height:60px;border-radius:30px;border:0;background:#0a84ff;color:#fff;
    font-size:32px;font-weight:300;line-height:60px;padding:0;
    box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:20;
  }
  .sheet,.detail{
    position:fixed;inset:0;z-index:30;background:#00000073;
    display:flex;align-items:flex-end;
  }
  .sheet[hidden],.detail[hidden]{display:none}
  .sheet-body{
    width:100%;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    max-height:92vh;overflow:auto;
  }
  .sheet-body img{width:100%;max-height:38vh;object-fit:contain;border-radius:12px;background:#f2f2f7;display:block;margin-bottom:14px}
  input.f,textarea.f{
    width:100%;border:0;border-radius:11px;background:#f2f2f7;padding:13px 14px;
    font-size:17px;outline:none;margin-bottom:10px;font-family:inherit;
  }
  textarea.f{resize:none;height:76px}
  .row{display:flex;gap:10px;margin-top:6px}
  .row button{
    flex:1;height:50px;border-radius:12px;border:0;font-size:17px;font-weight:600;
    background:#e3e3e9;color:#1c1c1e;font-family:inherit;
  }
  .row button.primary{background:#0a84ff;color:#fff}
  .detail{background:#fff;flex-direction:column;align-items:stretch;overflow:auto}
  .detail img{width:100%;max-height:56vh;object-fit:contain;background:#000}
  #back{
    position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;
    width:40px;height:40px;border-radius:20px;border:0;background:#ffffffd9;
    font-size:24px;line-height:36px;padding:0;color:#1c1c1e;z-index:2;
  }
  .d-body{padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
  #d-price{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
  #d-price i{font-size:24px;font-style:normal;font-weight:700}
  #d-name{font-size:19px;margin-top:6px}
  #d-note{font-size:16px;color:#6c6c70;margin-top:10px;white-space:pre-wrap}
  .d-body .row{margin-top:24px}
  .menu-item{
    display:block;width:100%;height:52px;border:0;border-radius:12px;
    background:#f2f2f7;color:#0a84ff;font-size:17px;font-weight:600;
    font-family:inherit;margin-bottom:10px;
  }
  .menu-item.gray{color:#1c1c1e;}
  .hint{font-size:13px;color:#8e8e93;line-height:1.6;margin:4px 2px 14px}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>看图记 <span id="count"></span></h1>
    <button id="menu">备份</button>
  </div>
  <input id="q" placeholder="搜名字 / 备注" autocomplete="off">
</header>

<main id="grid"></main>
<button id="add" aria-label="拍照增加">＋</button>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-body">
    <img id="preview" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
    <input class="f" id="f-name" placeholder="这是什么（冰红茶 大瓶）">
    <input class="f" id="f-price" placeholder="价格（5）" inputmode="decimal">
    <textarea class="f" id="f-note" placeholder="备注：品牌、放在哪、别的"></textarea>
    <div class="row">
      <button id="cancel">取消</button>
      <button id="save" class="primary">存下</button>
    </div>
  </div>
</div>

<div class="detail" id="detail" hidden>
  <button id="back">‹</button>
  <img id="d-img" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  <div class="d-body">
    <div id="d-price"></div>
    <div id="d-name"></div>
    <div id="d-note"></div>
    <div class="row">
      <button id="d-edit">改一下</button>
      <button id="d-del">删掉</button>
    </div>
  </div>
</div>

<div class="sheet" id="menuSheet" hidden>
  <div class="sheet-body">
    <button class="menu-item" id="export">导出备份到文件</button>
    <button class="menu-item" id="import">从备份文件恢复</button>
    <p class="hint">导出的文件会存进手机的「下载」里，顺手发一份到微信收藏。换手机、清数据之后，用它一键恢复。</p>
    <button class="menu-item gray" id="menuClose">关掉</button>
  </div>
</div>

<input type="file" accept="image/*" id="picker" hidden>
<input type="file" accept="application/json,.json" id="importer" hidden>

<script>
const DB='tuji', STORE='items';
let items=[], editing=null, pendingImg=null, current=null;

function db(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);
  r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function all(){const d=await db();return new Promise((ok,no)=>{const q=d.transaction(STORE).objectStore(STORE).getAll();
  q.onsuccess=()=>ok(q.result.sort((a,b)=>b.t-a.t));q.onerror=()=>no(q.error)})}
async function put(o){const d=await db();return new Promise((ok,no)=>{const q=d.transaction(STORE,'readwrite').objectStore(STORE).put(o);
  q.onsuccess=()=>ok();q.onerror=()=>no(q.error)})}
async function del(id){const d=await db();return new Promise((ok,no)=>{const q=d.transaction(STORE,'readwrite').objectStore(STORE).delete(id);
  q.onsuccess=()=>ok();q.onerror=()=>no(q.error)})}

function shrink(file,max=1000,q=.78){
  return new Promise((ok,no)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',q));
    };
    img.onerror=no;img.src=url;
  });
}

const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const kw=$('#q').value.trim().toLowerCase();
  const list=kw?items.filter(i=>(i.name+' '+i.note).toLowerCase().includes(kw)):items;
  $('#count').textContent=items.length?`${items.length} 样`:'';
  if(!list.length){
    $('#grid').innerHTML=`<div class="empty">${items.length?'没搜到':'还没有东西<br>点右下角的 ＋ 拍第一样'}</div>`;
    return;
  }
  $('#grid').innerHTML=list.map(i=>`
    <div class="card" data-id="${i.id}">
      <img src="${i.img}" loading="lazy" alt="${esc(i.name)}">
      <div class="txt">
        <div class="price">${i.price?`<i>¥</i>${esc(i.price)}`:'—'}</div>
        <div class="name">${esc(i.name)||'　'}</div>
      </div>
    </div>`).join('');
}

function openSheet(item,img){
  editing=item||null; pendingImg=img||null;
  $('#preview').src=img||'';
  $('#f-name').value=item?item.name:'';
  $('#f-price').value=item?item.price:'';
  $('#f-note').value=item?item.note:'';
  $('#sheet').hidden=false;
  if(!item)setTimeout(()=>$('#f-name').focus(),250);
}

$('#add').onclick=()=>$('#picker').click();
$('#picker').onchange=async e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f)return;
  try{openSheet(null,await shrink(f))}catch(_){alert('这张图读不出来，换一张试试')}
};
$('#cancel').onclick=()=>{$('#sheet').hidden=true;$('#preview').src='';pendingImg=null;editing=null};
$('#save').onclick=async()=>{
  const name=$('#f-name').value.trim(),price=$('#f-price').value.trim(),note=$('#f-note').value.trim();
  if(!name&&!price){alert('至少写个名字或价格');return}
  const rec=editing
    ?{...editing,name,price,note,img:pendingImg||editing.img}
    :{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:Date.now(),name,price,note,img:pendingImg};
  await put(rec);
  items=await all();
  $('#sheet').hidden=true;$('#detail').hidden=true;pendingImg=null;editing=null;
  render();
};

$('#grid').addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(!c)return;
  const it=items.find(x=>x.id===c.dataset.id); if(!it)return;
  current=it;
  $('#d-img').src=it.img;
  $('#d-price').innerHTML=it.price?`<i>¥</i>${esc(it.price)}`:'';
  $('#d-name').textContent=it.name||'';
  $('#d-note').textContent=it.note||'';
  $('#detail').hidden=false;
});
$('#back').onclick=()=>{$('#detail').hidden=true;current=null};
$('#d-edit').onclick=()=>{$('#detail').hidden=true;if(current)openSheet(current,current.img)};
$('#d-del').onclick=async()=>{
  if(!current||!confirm('删掉这一样？'))return;
  await del(current.id);items=await all();
  $('#detail').hidden=true;current=null;render();
};
$('#q').oninput=render;

$('#menu').onclick=()=>{$('#menuSheet').hidden=false};
$('#menuClose').onclick=()=>{$('#menuSheet').hidden=true};
$('#menuSheet').addEventListener('click',e=>{if(e.target.id==='menuSheet')$('#menuSheet').hidden=true});

$('#export').onclick=async()=>{
  if(!items.length){alert('还没有东西可导出');return}
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name=`看图记备份-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  const blob=new Blob([JSON.stringify({v:1,at:Date.now(),items})],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  $('#menuSheet').hidden=true;
};

$('#import').onclick=()=>$('#importer').click();
$('#importer').onchange=async e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    const list=Array.isArray(data)?data:data.items;
    if(!Array.isArray(list))throw 0;
    let n=0;
    for(const it of list){
      if(!it||!it.img||!it.id)continue;
      await put(it); n++;
    }
    items=await all(); render();
    $('#menuSheet').hidden=true;
    alert(`恢复了 ${n} 样`);
  }catch(_){alert('这个文件读不出来，要选「看图记备份-xxxx.json」')}
};

(async()=>{
  items=await all(); render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
