<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="喵喵速记">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preload" as="image" href="./bg.webp">
<title>喵喵图片速记便签</title>
<style>
  :root{
    --cream:#f6ead6;
    --cream-dim:rgba(246,234,214,.60);
    --gold:#e3b878;
    --gold-deep:#c99a55;
    --night:#12101f;
    --glass:rgba(26,21,40,.62);
    --line:rgba(227,184,120,.15);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font:16px/1.45 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    background:var(--night);color:var(--cream);
    padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior-y:contain;
    -webkit-font-smoothing:antialiased;
  }
  .bg{position:fixed;inset:0;z-index:-2;background:#12101f url(./bg.webp) center/cover no-repeat}
  .bg::after{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(130% 70% at 50% 0%,rgba(18,16,31,0) 30%,rgba(18,16,31,.50) 100%),
      linear-gradient(180deg,rgba(18,16,31,.34) 0%,rgba(18,16,31,.18) 42%,rgba(18,16,31,.42) 74%,rgba(18,16,31,.72) 100%);
  }
  ::selection{background:rgba(227,184,120,.35);color:#fff7e8}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:rgba(227,184,120,.22);border-radius:3px}

  header{
    position:sticky;top:0;z-index:10;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 20px;
    background:linear-gradient(180deg,rgba(18,16,31,.96) 0%,rgba(18,16,31,.84) 58%,rgba(18,16,31,0) 100%);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .hrow{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
  h1{
    font-size:19px;margin:0;font-weight:600;letter-spacing:.02em;flex:1;
    color:var(--cream);text-shadow:0 1px 12px rgba(0,0,0,.55);
  }
  h1 span{font-size:12px;font-weight:400;color:rgba(227,184,120,.85);margin-left:7px;letter-spacing:0}
  #menu{
    border:0;background:none;color:var(--gold);font-size:14px;font-family:inherit;
    padding:4px 2px;letter-spacing:.03em;
  }
  #q{
    width:100%;height:42px;border-radius:13px;font-size:16px;outline:none;
    background:rgba(30,24,46,.62);border:1px solid var(--line);
    color:var(--cream);padding:0 14px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #q::placeholder{color:rgba(246,234,214,.52)}
  #q:focus-visible,#menu:focus-visible{outline:2px solid rgba(227,184,120,.55);outline-offset:2px}

  main{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;
    padding:6px 16px 120px;
  }
  .card{
    min-width:0;
    background:var(--glass);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 12px 26px -10px rgba(0,0,0,.65);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    display:flex;flex-direction:column;
    transition:transform .18s cubic-bezier(.22,1,.36,1);
  }
  .card:active{transform:scale(.975)}
  .card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:rgba(255,255,255,.04)}
  .card .txt{padding:9px 11px 11px}
  .card .price{
    font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.15;
    color:var(--cream);font-variant-numeric:tabular-nums;
  }
  .card .price i{font-size:13px;font-weight:600;font-style:normal;margin-right:1px;color:var(--gold)}
  .card .name{
    font-size:12.5px;color:var(--cream-dim);margin-top:3px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .empty{
    grid-column:1/-1;text-align:center;color:rgba(248,238,222,.85);
    padding:64px 28px;font-size:15px;line-height:1.9;
    text-shadow:0 2px 16px rgba(0,0,0,.85),0 0 30px rgba(0,0,0,.6);
  }
  #add{
    position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 24px);
    width:60px;height:60px;border-radius:50%;border:0;padding:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(165deg,#efcb92,#c49450);
    box-shadow:0 12px 24px -8px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.35);
    z-index:20;
  }
  #add:active{transform:scale(.95)}
  #add svg{stroke:#231a2e;stroke-width:2.2;fill:none;stroke-linecap:round}

  .sheet,.detail{position:fixed;inset:0;z-index:30;background:rgba(8,6,14,.62);display:flex;align-items:flex-end}
  .sheet[hidden],.detail[hidden]{display:none}
  .sheet{opacity:0;transition:opacity .22s ease}
  .sheet.open{opacity:1}
  .sheet-body{
    width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));
    max-height:92vh;overflow:auto;
    background:rgba(22,18,34,.97);border-top:1px solid rgba(227,184,120,.22);
    box-shadow:0 -18px 40px rgba(0,0,0,.5);
    transform:translateY(16px);transition:transform .28s cubic-bezier(.22,1,.36,1);
  }
  .sheet.open .sheet-body{transform:translateY(0)}
  .sheet-body img{width:100%;max-height:38vh;object-fit:contain;border-radius:14px;background:rgba(255,255,255,.05);display:block;margin-bottom:14px}
  input.f,textarea.f{
    width:100%;border-radius:13px;padding:13px 14px;font-size:17px;outline:none;
    margin-bottom:10px;font-family:inherit;
    background:rgba(255,255,255,.055);border:1px solid rgba(227,184,120,.16);color:var(--cream);
  }
  input.f::placeholder,textarea.f::placeholder{color:rgba(246,234,214,.45)}
  input.f:focus,textarea.f:focus{border-color:rgba(227,184,120,.5);background:rgba(255,255,255,.08)}
  textarea.f{resize:none;height:78px}
  .row{display:flex;gap:10px;margin-top:6px}
  .row button{
    flex:1;height:50px;border-radius:14px;border:0;font-size:17px;font-weight:600;
    font-family:inherit;background:rgba(255,255,255,.08);color:var(--cream);
  }
  .row button.primary{background:linear-gradient(165deg,#efcb92,#c49450);color:#231a2e}
  .row button:active{transform:scale(.985)}

  .detail{background:var(--night);flex-direction:column;align-items:stretch;overflow:auto}
  .hero{position:relative;background:#07060d}
  .hero img{width:100%;max-height:58vh;object-fit:contain;display:block}
  .hero::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:160px;
    background:linear-gradient(180deg,rgba(18,16,31,0),rgba(18,16,31,.88) 72%,var(--night));
  }
  #back{
    position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:14px;
    width:40px;height:40px;border-radius:50%;border:1px solid rgba(227,184,120,.22);
    background:rgba(18,16,31,.72);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;padding:0;z-index:3;
  }
  #back svg{stroke:var(--cream);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .d-body{
    position:relative;margin-top:-46px;
    padding:24px 20px calc(28px + env(safe-area-inset-bottom));
    border-radius:24px 24px 0 0;background:var(--night);
    box-shadow:0 -24px 44px rgba(0,0,0,.55);
  }
  .d-label{font-size:11.5px;letter-spacing:.14em;color:rgba(227,184,120,.72);margin-bottom:5px}
  #d-price{font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1.08;font-variant-numeric:tabular-nums}
  #d-price i{font-size:23px;font-style:normal;font-weight:700;color:var(--gold);margin-right:2px}
  #d-price.noprice{font-size:24px;font-weight:600;color:rgba(246,234,214,.38);letter-spacing:.02em}
  #d-name{font-size:21px;font-weight:600;margin-top:16px;color:var(--cream)}
  .d-meta{font-size:12.5px;color:rgba(246,234,214,.45);margin-top:9px}
  .d-note-wrap{
    margin-top:22px;padding:14px 16px;border-radius:15px;
    background:rgba(255,255,255,.045);border:1px solid rgba(227,184,120,.10);
  }
  #d-note{font-size:15.5px;color:rgba(246,234,214,.84);white-space:pre-wrap;line-height:1.65}
  .d-body .row{margin-top:26px}

  .menu-item{
    display:block;width:100%;height:52px;border-radius:14px;
    background:rgba(255,255,255,.06);border:1px solid rgba(227,184,120,.16);
    color:var(--gold);font-size:16.5px;font-weight:600;font-family:inherit;margin-bottom:10px;
  }
  .menu-item.gray{color:var(--cream)}
  .hint{font-size:13px;color:rgba(246,234,214,.5);line-height:1.65;margin:4px 2px 14px}
</style>
</head>
<body>
<div class="bg"></div>

<header>
  <div class="hrow">
    <h1>喵喵图片速记便签 <span id="count"></span></h1>
    <button id="menu">备份</button>
  </div>
  <input id="q" placeholder="搜名字 / 备注" autocomplete="off">
</header>

<main id="grid"></main>
<button id="add" aria-label="拍照增加">
  <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-body">
    <img id="preview" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
    <input class="f" id="f-name" placeholder="今天想记住什么～喵">
    <input class="f" id="f-price" placeholder="哦～原来是这样（可不填）" inputmode="decimal">
    <textarea class="f" id="f-note" placeholder="多想想容易漏掉的细节！"></textarea>
    <div class="row">
      <button id="cancel">取消</button>
      <button id="save" class="primary">存下</button>
    </div>
  </div>
</div>

<div class="detail" id="detail" hidden>
  <div class="hero">
    <img id="d-img" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  </div>
  <button id="back" aria-label="返回">
    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="d-body">
    <div class="d-label">价格</div>
    <div id="d-price"></div>
    <div id="d-name"></div>
    <div class="d-meta" id="d-meta"></div>
    <div class="d-note-wrap" id="d-note-wrap">
      <div class="d-label">备注</div>
      <div id="d-note"></div>
    </div>
    <div class="row">
      <button id="d-edit">改一下</button>
      <button id="d-del">删掉</button>
    </div>
  </div>
</div>

<div class="sheet" id="menuSheet" hidden>
  <div class="sheet-body">
    <button class="menu-item" id="export">导出备份到文件</button>
    <button class="menu-item" id="import">从备份文件恢复</button>
    <p class="hint">导出的文件会存进手机的「下载」里，顺手发一份到微信收藏。换手机、清数据之后，用它一键恢复。</p>
    <button class="menu-item gray" id="menuClose">关掉</button>
  </div>
</div>

<input type="file" accept="image/*" id="picker" hidden>
<input type="file" accept="application/json,.json" id="importer" hidden>

<script>
const DB='tuji', STORE='items';
let items=[], editing=null, pendingImg=null, current=null;

function db(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);
  r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function all(){const d=await db();return new Promise((ok,no)=>{const q=d.transaction(STORE).objectStore(STORE).getAll();
  q.onsuccess=()=>ok(q.result.sort((a,b)=>b.t-a.t));q.onerror=()=>no(q.error)})}
async function put(o){const d=await db();return new Promise((ok,no)=>{const q=d.transaction(STORE,'readwrite').objectStore(STORE).put(o);
  q.onsuccess=()=>ok();q.onerror=()=>no(q.error)})}
async function del(id){const d=await db();return new Promise((ok,no)=>{const q=d.transaction(STORE,'readwrite').objectStore(STORE).delete(id);
  q.onsuccess=()=>ok();q.onerror=()=>no(q.error)})}

function shrink(file,max=1000,q=.78){
  return new Promise((ok,no)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',q));
    };
    img.onerror=no;img.src=url;
  });
}

const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=ts=>{const d=new Date(ts||Date.now()),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`};

function render(){
  const kw=$('#q').value.trim().toLowerCase();
  const list=kw?items.filter(i=>(i.name+' '+i.note).toLowerCase().includes(kw)):items;
  $('#count').textContent=items.length?`${items.length} 样`:'';
  if(!list.length){
    $('#grid').innerHTML=`<div class="empty">${items.length?'没找到这一样':'还空着呢～<br>点右下角的 ＋，拍第一样'}</div>`;
    return;
  }
  $('#grid').innerHTML=list.map(i=>`
    <div class="card" data-id="${i.id}">
      <img src="${i.img}" loading="lazy" alt="${esc(i.name)}">
      <div class="txt">
        <div class="price">${i.price?`<i>¥</i>${esc(i.price)}`:'—'}</div>
        <div class="name">${esc(i.name)||'　'}</div>
      </div>
    </div>`).join('');
}

function openSheet(item,img){
  editing=item||null; pendingImg=img||null;
  $('#preview').src=img||'';
  $('#f-name').value=item?item.name:'';
  $('#f-price').value=item?item.price:'';
  $('#f-note').value=item?item.note:'';
  const s=$('#sheet');
  s.hidden=false;
  requestAnimationFrame(()=>s.classList.add('open'));
  if(!item)setTimeout(()=>$('#f-name').focus(),280);
}
function closeSheet(){
  const s=$('#sheet');
  s.classList.remove('open');
  setTimeout(()=>{s.hidden=true;$('#preview').src=''},220);
  pendingImg=null;editing=null;
}

$('#add').onclick=()=>$('#picker').click();
$('#picker').onchange=async e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f)return;
  try{openSheet(null,await shrink(f))}catch(_){alert('这张图读不出来，换一张试试')}
};
$('#cancel').onclick=closeSheet;
$('#save').onclick=async()=>{
  const name=$('#f-name').value.trim(),price=$('#f-price').value.trim(),note=$('#f-note').value.trim();
  if(!name){alert('先给它起个名字吧');return}
  const rec=editing
    ?{...editing,name,price,note,img:pendingImg||editing.img}
    :{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:Date.now(),name,price,note,img:pendingImg};
  await put(rec);
  items=await all();
  $('#sheet').classList.remove('open');
  $('#sheet').hidden=true;$('#detail').hidden=true;pendingImg=null;editing=null;
  render();
};

$('#grid').addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(!c)return;
  const it=items.find(x=>x.id===c.dataset.id); if(!it)return;
  current=it;
  $('#d-img').src=it.img;
  const hasPrice=!!(it.price&&String(it.price).trim());
  $('#d-price').innerHTML=hasPrice?`<i>¥</i>${esc(it.price)}`:'没记价格';
  $('#d-price').classList.toggle('noprice',!hasPrice);
  $('#d-name').textContent=it.name||'';
  $('#d-meta').textContent='记于 '+fmt(it.t);
  const hasNote=!!(it.note&&it.note.trim());
  $('#d-note-wrap').hidden=!hasNote;
  $('#d-note').textContent=it.note||'';
  $('#detail').hidden=false;
  $('#detail').scrollTop=0;
});
$('#back').onclick=()=>{$('#detail').hidden=true;current=null};
$('#d-edit').onclick=()=>{$('#detail').hidden=true;if(current)openSheet(current,current.img)};
$('#d-del').onclick=async()=>{
  if(!current||!confirm('删掉这一样？'))return;
  await del(current.id);items=await all();
  $('#detail').hidden=true;current=null;render();
};
$('#q').oninput=render;

function openMenu(){
  const s=$('#menuSheet');s.hidden=false;
  requestAnimationFrame(()=>s.classList.add('open'));
}
function closeMenu(){
  const s=$('#menuSheet');s.classList.remove('open');
  setTimeout(()=>s.hidden=true,220);
}
$('#menu').onclick=openMenu;
$('#menuClose').onclick=closeMenu;
$('#menuSheet').addEventListener('click',e=>{if(e.target.id==='menuSheet')closeMenu()});

$('#export').onclick=async()=>{
  if(!items.length){alert('还没有东西可导出');return}
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name=`喵喵速记备份-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  const blob=new Blob([JSON.stringify({v:1,at:Date.now(),items})],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  closeMenu();
};

$('#import').onclick=()=>$('#importer').click();
$('#importer').onchange=async e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    const list=Array.isArray(data)?data:data.items;
    if(!Array.isArray(list))throw 0;
    let n=0;
    for(const it of list){
      if(!it||!it.img||!it.id)continue;
      await put(it); n++;
    }
    items=await all(); render(); closeMenu();
    alert(`恢复了 ${n} 样`);
  }catch(_){alert('这个文件读不出来，要选「喵喵速记备份-xxxx.json」')}
};

(async()=>{
  items=await all(); render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
